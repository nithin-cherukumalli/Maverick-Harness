name: Maverick Traps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  traps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run trap scenarios
        run: python3 trap-project/run_traps.py
